[workspace]
resolver = "2"
members = [
    "crates/mpt",
    "crates/walk",
    "crates/pack",
    "crates/render",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/project-vyasa/vyutils"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
